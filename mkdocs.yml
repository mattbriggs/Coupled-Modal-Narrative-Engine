site_name: Coupled Modal Narrative Engine
site_description: Design, API reference, and task-based user manual for CMNE Workbench
repo_url: https://github.com/mattbriggs/Coupled-Modal-Narrative-Engine
repo_name: mattbriggs/Coupled-Modal-Narrative-Engine
docs_dir: site
site_dir: docs
use_directory_urls: false
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install and launch: getting-started/install.md
      - Documentation build: getting-started/documentation.md
  - User manual:
      - How to use this manual: manual/index.md
      - First run — S-01: manual/first-run.md
      - Build a scene — S-02: manual/build-scene.md
      - Revise and compare — S-03, S-05, S-06: manual/revise-compare.md
      - Generate and export — S-04: manual/generate-export.md
      - Read the result: manual/read-output.md
      - Prepare a blinded evaluation — S-07 to S-09: manual/evaluate-study.md
      - Constructs and rules: manual/constructs.md
      - Recovery and troubleshooting — S-10, S-13: manual/troubleshooting.md
  - Design:
      - Design overview: design/index.md
      - Domain model and theory: design/domain-model.md
      - Runtime architecture: design/architecture.md
      - Pipeline and checks: design/pipeline.md
      - Storage and integrity: design/storage.md
      - Current limits and roadmap: design/roadmap.md
      - Software code review: design/code-review.md
  - API:
      - API overview: api/index.md
      - Python kernel: api/python.md
      - Command line: api/cli.md
      - Model adapters: api/model-adapters.md
      - JSON-RPC sidecar: api/json-rpc.md
      - Data contracts and errors: api/contracts.md
      - Error catalog: api/error-catalog.md
      - Tauri bridge: api/tauri.md
