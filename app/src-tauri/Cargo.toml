[package]
name = "cmne-workbench"
version = "0.1.0"
description = "Coupled Modal Narrative Engine desktop workbench"
authors = ["Final State Press"]
edition = "2021"

[lib]
name = "cmne_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
